<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | LeadConnect</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md animate-fade-in">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 mb-6">
        <div class="w-10 h-10 gradient-brand rounded-lg flex items-center justify-center text-white font-bold">LC</div>
        <span class="text-xl font-bold text-gray-900">LeadConnect</span>
      </a>
      <h2 class="text-3xl font-bold text-gray-900">Create your account</h2>
      <p class="mt-2 text-gray-600">Start finding B2B clients with AI</p>
    </div>
    
    <form id="signupForm" class="card p-8 space-y-5" novalidate>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="form-label required" for="firstName">First name</label>
          <input id="firstName" name="firstName" type="text" autocomplete="given-name" required 
            class="form-input" placeholder="John">
        </div>
        <div>
          <label class="form-label required" for="lastName">Last name</label>
          <input id="lastName" name="lastName" type="text" autocomplete="family-name" required 
            class="form-input" placeholder="Doe">
        </div>
      </div>

      <div>
        <label class="form-label required" for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required 
          class="form-input" placeholder="you@example.com">
      </div>

      <div>
        <label class="form-label" for="company">Company (optional)</label>
        <input id="company" name="company" type="text" autocomplete="organization" 
          class="form-input" placeholder="Company name">
      </div>

      <div>
        <label class="form-label required" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required 
          class="form-input" placeholder="Min 8 characters">
      </div>

      <div>
        <label class="form-label required" for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required 
          class="form-input" placeholder="Confirm password">
      </div>

      <div class="form-checkbox">
        <input type="checkbox" id="terms" name="terms" required class="form-checkbox-input">
        <label for="terms">I agree to the <a href="#" class="text-brand-600 hover:text-brand-500">Terms of Service</a> and <a href="#" class="text-brand-600 hover:text-brand-500">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full">
        <span class="btn-text"><i class="fas fa-user-plus mr-2"></i>Create account</span>
      </button>
    </form>

    <div class="text-center text-sm text-gray-600 mt-6">
      <p>Already have an account? <a href="/login" class="font-medium text-brand-600 hover:text-brand-500">Sign in</a></p>
    </div>
    
    <div id="errorMessage" class="toast toast-error hidden" role="alert"></div>
    <div id="successMessage" class="toast toast-success hidden" role="alert"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
