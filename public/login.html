<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LeadConnect</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md animate-fade-in">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 mb-6">
        <div class="w-10 h-10 gradient-brand rounded-lg flex items-center justify-center text-white font-bold">LC</div>
        <span class="text-xl font-bold text-gray-900">LeadConnect</span>
      </a>
      <h2 class="text-3xl font-bold text-gray-900">Welcome back</h2>
      <p class="mt-2 text-gray-600">Sign in to your account to continue</p>
    </div>
    
    <form id="loginForm" class="card p-8 space-y-6" novalidate>
      <div>
        <label class="form-label required" for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required 
          class="form-input" placeholder="you@example.com">
      </div>

      <div>
        <label class="form-label required" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required 
          class="form-input" placeholder="••••••••">
      </div>

      <div class="flex items-center justify-between">
        <label class="form-checkbox cursor-pointer">
          <input type="checkbox" name="remember" class="form-checkbox-input">
          <span>Remember me</span>
        </label>
        <a href="/forgot-password" class="text-sm font-medium text-brand-600 hover:text-brand-500">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full">
        <span class="btn-text"><i class="fas fa-sign-in-alt mr-2"></i>Sign in</span>
      </button>
    </form>

    <div class="text-center text-sm text-gray-600 mt-6">
      <p>Don't have an account? <a href="/signup" class="font-medium text-brand-600 hover:text-brand-500">Sign up</a></p>
    </div>
    
    <div id="errorMessage" class="toast toast-error hidden" role="alert"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
